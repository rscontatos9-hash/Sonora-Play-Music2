<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060A">
<title>LinguaVox — Tradutor Universal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  :root {
    --bg: #05060A;
    --panel-bg: #121420;
    --panel-border: #23273A;
    --text-main: #E2E8F0;
    --text-muted: #8B93B8;
    --cyan: #22D3EE;
    --violet: #A855F7;
    --accent: #4F7CFF;
    --success: #34D399;
    --error: #FB7185;
    --btn-bg: #1A1D2D;
    --btn-hover: #23273A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg);
    color: var(--text-main);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    overflow-x: hidden;
    position: relative;
  }

  /* Fundo com brilho sutil (Glow) */
  body::before {
    content: '';
    position: absolute;
    top: -100px;
    left: 50%;
    transform: translateX(-50%);
    width: 100vw;
    height: 400px;
    background: radial-gradient(circle at center, rgba(79, 124, 255, 0.15) 0%, transparent 70%);
    z-index: 0;
    pointer-events: none;
  }

  .app-container {
    width: 100%;
    max-width: 480px;
    padding: 20px 16px 40px;
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* Header */
  .header { text-align: center; margin-bottom: 8px; }
  
  .badge {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #CBD5E1;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .logo {
    font-size: 38px;
    font-weight: 800;
    background: linear-gradient(100deg, #7DD3FC, #818CF8 50%, #C084FC);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.03em;
    margin-bottom: 8px;
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 13px;
    line-height: 1.5;
    padding: 0 20px;
  }

  /* Language Selector Bar */
  .lang-bar {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 8px;
    align-items: center;
  }

  .lang-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--btn-bg);
    border: 1px solid var(--panel-border);
    padding: 12px 14px;
    border-radius: 16px;
    color: var(--text-main);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    width: 100%;
    justify-content: center;
  }

  .lang-btn:hover { background: var(--btn-hover); }
  .lang-btn .flag { font-size: 18px; }

  .swap-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, #4F7CFF, #A855F7);
    border: none;
    color: white;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(79, 124, 255, 0.4);
    transition: transform 0.2s;
  }
  .swap-btn:active { transform: scale(0.95); }

  /* Menus Dropdown */
  .sel-container { position: relative; }
  .dropdown {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    width: 100%;
    max-height: 250px;
    overflow-y: auto;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 8px;
    z-index: 100;
    display: none;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .dropdown.active { display: block; }
  .dropdown-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text-muted);
  }
  .dropdown-item:hover { background: rgba(255,255,255,0.05); color: white; }
  .dropdown-item.active { color: var(--accent); font-weight: 600; }

  /* Panels */
  .panel {
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 24px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .panel-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .label-origem { color: var(--cyan); }
  .label-traducao { color: #C084FC; }

  .chip {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
    background: rgba(255,255,255,0.05);
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--panel-border);
  }

  textarea {
    width: 100%;
    min-height: 90px;
    background: transparent;
    border: none;
    color: var(--text-main);
    font-size: 16px;
    font-family: inherit;
    resize: none;
    outline: none;
    line-height: 1.5;
  }
  textarea::placeholder { color: var(--text-muted); opacity: 0.6; }

  .action-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }

  .action-btn {
    background: var(--btn-bg);
    border: 1px solid var(--panel-border);
    padding: 10px;
    border-radius: 999px;
    color: var(--text-main);
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .action-btn:hover { background: var(--btn-hover); }

  .voice-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 4px;
  }

  .voice-btn {
    background: transparent;
    border: 1px solid var(--panel-border);
    padding: 10px;
    border-radius: 999px;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .voice-btn.active {
    background: rgba(79, 124, 255, 0.1);
    border-color: rgba(79, 124, 255, 0.4);
    color: #A5B4FC;
  }

  .panel-footer {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 4px;
    font-weight: 500;
  }

  /* Main Button */
  .main-btn {
    width: 100%;
    padding: 18px;
    border-radius: 20px;
    background: linear-gradient(100deg, #4F7CFF, #A855F7);
    border: none;
    color: white;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.03em;
    cursor: pointer;
    box-shadow: 0 8px 25px -5px rgba(168, 85, 247, 0.5);
    transition: all 0.2s;
    margin-top: 8px;
  }
  .main-btn:hover { opacity: 0.95; transform: translateY(-1px); }
  .main-btn:active { transform: translateY(1px); }
  .main-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

  .status-msg {
    text-align: center;
    font-size: 13px;
    font-weight: 500;
    color: var(--success);
    min-height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .status-msg.error { color: var(--error); }

  .app-footer {
    text-align: center;
    font-size: 11px;
    color: #4B526D;
    margin-top: 10px;
    line-height: 1.6;
  }

  /* Overlay Legenda */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 6, 10, 0.9);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000;
  }
  .overlay.active { display: flex; }
  .overlay-content {
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 24px;
    padding: 24px;
    width: 100%;
    max-width: 400px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  }
  .overlay-content h3 { margin-bottom: 16px; color: var(--cyan); font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em; }
  .overlay-content p { font-size: 20px; font-weight: 600; margin-bottom: 24px; line-height: 1.4; }
  .overlay-content small { display: block; color: var(--text-muted); margin-bottom: 24px; font-size: 14px; }
  
  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 10px; }
</style>
</head>
<body>

<div class="app-container">
  
  <!-- Header -->
  <header class="header">
    <div class="badge">Tradutor com voz e legenda</div>
    <h1 class="logo">LinguaVox</h1>
    <p class="subtitle">Traduza entre 30 idiomas com motor Google • MyMemory • Libre, áudio perfeito e legenda.</p>
  </header>

  <!-- Language Selector -->
  <div class="lang-bar">
    <div class="sel-container" id="fromContainer">
      <button class="lang-btn" id="fromBtn">
        <span class="flag" id="fromFlag">🇧🇷</span>
        <span id="fromName">Português</span>
      </button>
      <div class="dropdown" id="fromDropdown"></div>
    </div>
    
    <button class="swap-btn" id="swapBtn">⇅</button>
    
    <div class="sel-container" id="toContainer">
      <button class="lang-btn" id="toBtn">
        <span class="flag" id="toFlag">🇺🇸</span>
        <span id="toName">Inglês</span>
      </button>
      <div class="dropdown" id="toDropdown"></div>
    </div>
  </div>

  <!-- Origem Panel -->
  <div class="panel">
    <div class="panel-header">
      <span class="panel-label label-origem">Origem</span>
      <span class="chip" id="fromChip">Português</span>
    </div>
    <textarea id="srcText" placeholder="Digite o texto para traduzir..."></textarea>
    
    <div class="action-grid">
      <button class="action-btn" id="micBtn">🎤 Falar</button>
      <button class="action-btn" id="speakSrcBtn">🔊 Ouvir</button>
      <button class="action-btn" id="clearBtn">✕ Limpar</button>
      <button class="action-btn" id="histBtn">🕒 Histórico (<span id="histCount">0</span>)</button>
    </div>

    <div class="voice-grid">
      <button class="voice-btn active" data-gender="female">♀ Mulher • Suave</button>
      <button class="voice-btn" data-gender="male">♂ Homem • Grave</button>
    </div>

    <div class="panel-footer">
      <span id="srcCount">0 caracteres</span>
      <span>Ctrl+Enter</span>
    </div>
  </div>

  <!-- Tradução Panel -->
  <div class="panel">
    <div class="panel-header">
      <span class="panel-label label-traducao">Tradução</span>
      <span class="chip" id="toChip">Inglês 100%</span>
    </div>
    <textarea id="outText" placeholder="A tradução aparecerá aqui..." readonly></textarea>
    
    <div class="action-grid" style="grid-template-columns: 1fr 1fr 1fr;">
      <button class="action-btn" id="speakOutBtn">🔊 Ouvir</button>
      <button class="action-btn" id="copyBtn">📋 Copiar</button>
      <button class="action-btn" id="subBtn">▭ Legenda</button>
    </div>

    <div class="voice-grid">
      <button class="voice-btn active" data-gender="female" data-panel="out">♀ Mulher • Suave</button>
      <button class="voice-btn" data-gender="male" data-panel="out">♂ Homem • Grave</button>
    </div>

    <div class="panel-footer">
      <span id="outCount">0 caracteres</span>
      <span>Tradução automática</span>
    </div>
  </div>

  <!-- Main Action -->
  <button class="main-btn" id="translateBtn">TRADUZIR AGORA</button>
  
  <div class="status-msg" id="statusMsg">
    <!-- Status inicial vazio -->
  </div>

  <div class="app-footer">
    LinguaVox • tradução via Google + MyMemory • 100% no navegador
  </div>
</div>

<!-- Overlay Legenda -->
<div class="overlay" id="overlay">
  <div class="overlay-content">
    <h3>Modo Legenda</h3>
    <small id="ovSrc"></small>
    <p id="ovOut"></p>
    <div class="action-grid">
      <button class="action-btn" id="ovClose">Fechar</button>
      <button class="action-btn active" id="ovPlay">🔊 Ouvir</button>
    </div>
  </div>
</div>

<script>
  // Dados dos Idiomas
  const LANGS = [
    {c:"pt", n:"Português", f:"🇧🇷"}, {c:"en", n:"Inglês", f:"🇺🇸"},
    {c:"es", n:"Espanhol", f:"🇪🇸"}, {c:"fr", n:"Francês", f:"🇫🇷"},
    {c:"it", n:"Italiano", f:"🇮🇹"}, {c:"de", n:"Alemão", f:"🇩🇪"},
    {c:"ja", n:"Japonês", f:"🇯🇵"}, {c:"ko", n:"Coreano", f:"🇰🇷"},
    {c:"zh", n:"Chinês", f:"🇨🇳"}, {c:"ru", n:"Russo", f:"🇷🇺"},
    {c:"ar", n:"Árabe", f:"🇸🇦"}, {c:"hi", n:"Hindi", f:"🇮🇳"},
    {c:"nl", n:"Holandês", f:"🇳🇱"}, {c:"pl", n:"Polonês", f:"🇵🇱"},
    {c:"tr", n:"Turco", f:"🇹🇷"}, {c:"uk", n:"Ucraniano", f:"🇺🇦"},
    {c:"el", n:"Grego", f:"🇬🇷"}, {c:"he", n:"Hebraico", f:"🇮🇱"},
    {c:"th", n:"Tailandês", f:"🇹🇭"}, {c:"vi", n:"Vietnamita", f:"🇻🇳"},
    {c:"sv", n:"Sueco", f:"🇸🇪"}, {c:"no", n:"Norueguês", f:"🇳🇴"},
    {c:"da", n:"Dinamarquês", f:"🇩🇰"}, {c:"fi", n:"Finlandês", f:"🇫🇮"},
    {c:"ro", n:"Romeno", f:"🇷🇴"}, {c:"cs", n:"Tcheco", f:"🇨🇿"},
    {c:"hu", n:"Húngaro", f:"🇭🇺"}, {c:"id", n:"Indonésio", f:"🇮🇩"},
    {c:"tl", n:"Filipino", f:"🇵🇭"}, {c:"bn", n:"Bengali", f:"🇧🇩"}
  ];

  // Estado Global
  let state = {
    from: "pt",
    to: "en",
    gender: "female",
    history: []
  };

  // Carregar do localStorage
  try {
    const savedHist = localStorage.getItem("linguavox-h");
    if (savedHist) state.history = JSON.parse(savedHist);
    const savedFrom = localStorage.getItem("linguavox-from");
    if (savedFrom) state.from = savedFrom;
    const savedTo = localStorage.getItem("linguavox-to");
    if (savedTo) state.to = savedTo;
    const savedGender = localStorage.getItem("linguavox-gender");
    if (savedGender) state.gender = savedGender;
  } catch (e) {}

  // Elementos DOM
  const srcText = document.getElementById("srcText");
  const outText = document.getElementById("outText");
  const translateBtn = document.getElementById("translateBtn");
  const statusMsg = document.getElementById("statusMsg");
  const srcCount = document.getElementById("srcCount");
  const outCount = document.getElementById("outCount");
  const fromFlag = document.getElementById("fromFlag");
  const fromName = document.getElementById("fromName");
  const fromChip = document.getElementById("fromChip");
  const toFlag = document.getElementById("toFlag");
  const toName = document.getElementById("toName");
  const toChip = document.getElementById("toChip");
  const fromDropdown = document.getElementById("fromDropdown");
  const toDropdown = document.getElementById("toDropdown");
  const histCount = document.getElementById("histCount");

  // Utilitários
  const langBy = (code) => LANGS.find(l => l.c === code) || LANGS[0];
  
  function setStatus(text, isError = false) {
    statusMsg.innerHTML = text;
    statusMsg.className = `status-msg ${isError ? 'error' : ''}`;
  }

  function updateCounts() {
    srcCount.textContent = `${srcText.value.length} caracteres`;
    outCount.textContent = `${outText.value.length} caracteres`;
  }

  // Preencher Dropdowns
  function renderDropdowns() {
    fromDropdown.innerHTML = "";
    toDropdown.innerHTML = "";
    
    LANGS.forEach(l => {
      // Origem
      const divF = document.createElement("div");
      divF.className = `dropdown-item ${l.c === state.from ? 'active' : ''}`;
      divF.innerHTML = `<span class="flag">${l.f}</span> ${l.n}`;
      divF.onclick = () => {
        state.from = l.c;
        updateLangUI();
        fromDropdown.classList.remove("active");
        if (srcText.value.trim()) doTranslate();
      };
      fromDropdown.appendChild(divF);

      // Destino
      const divT = document.createElement("div");
      divT.className = `dropdown-item ${l.c === state.to ? 'active' : ''}`;
      divT.innerHTML = `<span class="flag">${l.f}</span> ${l.n}`;
      divT.onclick = () => {
        state.to = l.c;
        updateLangUI();
        toDropdown.classList.remove("active");
        if (srcText.value.trim()) doTranslate();
      };
      toDropdown.appendChild(divT);
    });
  }

  function updateLangUI() {
    const lFrom = langBy(state.from);
    const lTo = langBy(state.to);
    
    fromFlag.textContent = lFrom.f;
    fromName.textContent = lFrom.n;
    fromChip.textContent = lFrom.n;
    
    toFlag.textContent = lTo.f;
    toName.textContent = lTo.n;
    toChip.textContent = lTo.n + " 100%";
    
    renderDropdowns();
    localStorage.setItem("linguavox-from", state.from);
    localStorage.setItem("linguavox-to", state.to);
  }

  // Controle dos Dropdowns
  document.getElementById("fromBtn").onclick = (e) => {
    e.stopPropagation();
    fromDropdown.classList.toggle("active");
    toDropdown.classList.remove("active");
  };
  document.getElementById("toBtn").onclick = (e) => {
    e.stopPropagation();
    toDropdown.classList.toggle("active");
    fromDropdown.classList.remove("active");
  };
  document.addEventListener("click", () => {
    fromDropdown.classList.remove("active");
    toDropdown.classList.remove("active");
  });

  // Swap de Idiomas
  document.getElementById("swapBtn").onclick = () => {
    const temp = state.from;
    state.from = state.to;
    state.to = temp;
    
    const tempText = srcText.value;
    srcText.value = outText.value;
    outText.value = tempText;
    
    updateLangUI();
    updateCounts();
    if (srcText.value.trim()) doTranslate();
  };

  // APIs de Tradução (Alta Precisão)
  async function translateGoogle(text, from, to) {
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${from}&tl=${to}&dt=t&q=${encodeURIComponent(text)}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error("Google API Error");
    const data = await res.json();
    return data[0].map(x => x[0]).join("");
  }

  async function translateMyMemory(text, from, to) {
    const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error("MyMemory API Error");
    const data = await res.json();
    if (data.responseData && data.responseData.translatedText) return data.responseData.translatedText;
    throw new Error("Tradução vazia");
  }

  // Motor de Tradução Robusto
  async function robustTranslate(text, from, to) {
    if (!text.trim()) return "";
    
    // Tenta Google primeiro (mais preciso)
    try { return await translateGoogle(text, from, to); } catch (e) { console.warn("Google falhou, tentando MyMemory..."); }
    
    // Fallback para MyMemory
    try { return await translateMyMemory(text, from, to); } catch (e) { console.warn("MyMemory falhou."); }
    
    throw new Error("Todos os motores de tradução falharam.");
  }

  // Ação Principal
  let isTranslating = false;
  async function doTranslate() {
    const text = srcText.value.trim();
    if (!text) {
      outText.value = "";
      updateCounts();
      setStatus("Digite algo para traduzir.");
      return;
    }
    if (isTranslating) return;
    
    isTranslating = true;
    translateBtn.disabled = true;
    translateBtn.textContent = "TRADUZINDO...";
    setStatus("Traduzindo...");

    try {
      const result = await robustTranslate(text, state.from, state.to);
      outText.value = result;
      updateCounts();
      
      setStatus("✓ Traduzido • 100%", false);
      
      // Salvar Histórico
      state.history.unshift({ src: text, out: result, at: Date.now() });
      if (state.history.length > 30) state.history.pop();
      localStorage.setItem("linguavox-h", JSON.stringify(state.history));
      localStorage.setItem("linguavox-src", text);
      localStorage.setItem("linguavox-out", result);
      updateHistoryUI();
      
    } catch (error) {
      setStatus("Erro na tradução. Verifique sua conexão.", true);
    } finally {
      isTranslating = false;
      translateBtn.disabled = false;
      translateBtn.textContent = "TRADUZIR AGORA";
    }
  }

  translateBtn.onclick = doTranslate;

  // Textarea Input
  srcText.addEventListener("input", () => {
    updateCounts();
    clearTimeout(window._typingTimer);
    window._typingTimer = setTimeout(() => {
      if (srcText.value.trim().length >= 3) doTranslate();
    }, 1000);
  });

  // Ctrl + Enter para traduzir
  srcText.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") doTranslate();
  });

  // Limpar
  document.getElementById("clearBtn").onclick = () => {
    srcText.value = "";
    outText.value = "";
    updateCounts();
    setStatus("");
    srcText.focus();
  };

  // Cópia
  document.getElementById("copyBtn").onclick = async () => {
    if (!outText.value) return;
    try {
      await navigator.clipboard.writeText(outText.value);
      setStatus("✓ Copiado!");
    } catch (e) {
      outText.select();
      document.execCommand("copy");
      setStatus("✓ Copiado!");
    }
  };

  // Vozes (TTS)
  function speak(text, langCode) {
    if (!text.trim()) return;
    if (!("speechSynthesis" in window)) {
      setStatus("Áudio não suportado neste navegador.", true);
      return;
    }
    
    speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    const voices = speechSynthesis.getVoices();
    
    let targetCode = langCode;
    if (langCode === "pt") targetCode = "pt-BR";
    else if (langCode === "en") targetCode = "en-US";
    
    const voice = voices.find(v => v.lang.startsWith(targetCode)) || voices.find(v => v.lang.startsWith(langCode));
    
    if (voice) utterance.voice = voice;
    utterance.lang = voice ? voice.lang : targetCode;
    
    // Ajuste baseado no Gênero selecionado
    if (state.gender === "male") {
      utterance.rate = 0.85;
      utterance.pitch = 0.7; // Mais grave
    } else {
      utterance.rate = 0.95;
      utterance.pitch = 1.15; // Mais agudo e suave
    }
    
    speechSynthesis.speak(utterance);
  }

  document.getElementById("speakSrcBtn").onclick = () => speak(srcText.value, state.from);
  document.getElementById("speakOutBtn").onclick = () => speak(outText.value, state.to);

  // Alternar Gênero
  document.querySelectorAll(".voice-btn").forEach(btn => {
    btn.onclick = () => {
      state.gender = btn.dataset.gender;
      document.querySelectorAll(".voice-btn").forEach(b => b.classList.remove("active"));
      
      // Ativa apenas os botões do gênero selecionado em ambos os painéis
      document.querySelectorAll(`.voice-btn[data-gender="${state.gender}"]`).forEach(b => b.classList.add("active"));
      localStorage.setItem("linguavox-gender", state.gender);
    };
  });

  // Histórico (UI Simples)
  function updateHistoryUI() {
    histCount.textContent = state.history.length;
  }
  
  document.getElementById("histBtn").onclick = () => {
    if (state.history.length === 0) {
      setStatus("Nenhum histórico ainda.");
      return;
    }
    const last = state.history[0];
    srcText.value = last.src;
    outText.value = last.out;
    updateCounts();
    setStatus("Histórico recuperado.");
  };

  // Legenda Overlay
  const overlay = document.getElementById("overlay");
  document.getElementById("subBtn").onclick = () => {
    if (!outText.value) {
      setStatus("Traduza algo primeiro.", true);
      return;
    }
    document.getElementById("ovSrc").textContent = srcText.value;
    document.getElementById("ovOut").textContent = outText.value;
    overlay.classList.add("active");
  };
  
  document.getElementById("ovClose").onclick = () => overlay.classList.remove("active");
  document.getElementById("ovPlay").onclick = () => speak(outText.value, state.to);
  overlay.onclick = (e) => { if (e.target === overlay) overlay.classList.remove("active"); };

  // Inicialização
  function init() {
    updateLangUI();
    updateHistoryUI();
    updateCounts();
    
    // Restaurar último texto
    const savedSrc = localStorage.getItem("linguavox-src");
    const savedOut = localStorage.getItem("linguavox-out");
    if (savedSrc) srcText.value = savedSrc;
    if (savedOut) outText.value = savedOut;
    updateCounts();

    // Ativar botão de gênero correto
    document.querySelectorAll(".voice-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(`.voice-btn[data-gender="${state.gender}"]`).forEach(b => b.classList.add("active"));
    
    // Carregar vozes
    if ("speechSynthesis" in window) {
      speechSynthesis.getVoices();
      setTimeout(() => speechSynthesis.getVoices(), 500);
    }
  }

  init();
</script>
</body>
</html>
