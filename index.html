        .bg-fx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}

        .select{position:relative;min-width:0}
        .select-btn{width:100%;display:flex;align-items:center;gap:8px;height:clamp(46px,11vw,52px);padding:0 clamp(10px,2.5vw,14px);border-radius:var(--r-md);background:rgba(255,255,255,.045);border:1px solid var(--border);color:var(--text);font-size:clamp(13px,3.3vw,14.5px);font-weight:500;cursor:pointer;transition:background .18s, border-color .18s, box-shadow .18s;-webkit-tap-highlight-color:transparent;}

        .select-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
        .select.is-open .select-btn{border-color:rgba(91,140,255,.65);box-shadow:0 0 0 3px rgba(91,140,255,.16);}
        .s-flag{font-size:16px;line-height:1;flex-shrink:0}

        .select.is-open .s-caret{transform:rotate(180deg)}

        .swap svg{width:19px;height:19px;transition:transform .35s ease}
