<!DOCTYPE html>
<html lang="pt-BR">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LinguaVox</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,Segoe UI,Roboto,sans-serif;background:#0f0f1a;color:#fff;padding:14px}
h1{text-align:center;background:linear-gradient(90deg,#0A84FF,#5E5CE6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:30px;margin:16px 0 4px}
.sub{text-align:center;color:#8a8aa3;font-size:13px;margin-bottom:16px}
.card{max-width:840px;margin:0 auto;background:#1c1c28;border-radius:18px;padding:16px;border:1px solid #2a2a3a}
.row{display:flex;gap:8px;margin-bottom:12px}
select{flex:1;padding:12px;border-radius:10px;background:#252538;color:#fff;border:1px solid #333;font-size:15px}
.swap{width:46px;border-radius:50%;background:#0A84FF;color:#fff;border:none;font-size:18px;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.box{background:#252538;border-radius:14px;padding:12px;border:1px solid #333}
textarea{width:100%;min-height:120px;background:transparent;border:none;color:#fff;font-size:18px;outline:none;resize:none}
textarea::placeholder{color:#555}
.btns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.b{padding:8px 10px;border-radius:8px;border:none;background:#2a2a3a;color:#ddd;font-size:13px;cursor:pointer}
.primary{width:100%;margin-top:14px;background:#0A84FF;color:#fff;padding:15px;border-radius:12px;font-weight:700;font-size:16px;border:none;cursor:pointer}
.st{color:#0A84FF;text-align:center;margin-top:10px;font-size:13px;min-height:16px}
.overlay{position:fixed;inset:0;background:#000;display:none;flex-direction:column;justify-content:flex-end;padding:30px 16px 70px;z-index:99}
.overlay.show{display:flex}
.lo{color:#aaa;text-align:center;font-size:18px}
.lt{color:#fff;text-align:center;font-size:34px;font-weight:800;margin-top:12px;line-height:1.2}
.cl{position:absolute;top:14px;right:14px;background:#222;color:#fff;border:none;padding:10px 14px;border-radius:8px;cursor:pointer}
.cl2{right:100px}
</style>
</head>
<body>
<h1>LinguaVox</h1>
<div class="sub">Tradutor Universal • Áudio + Legenda • 30 idiomas • Inspirado no DeepL e Google</div>
<div class="card">
<div class="row"><select id="from"></select><button class="swap" id="sw">↔</button><select id="to"></select></div>
<div class="grid">
<div class="box"><div style="font-size:11px;color:#888">ORIGEM</div><textarea id="orig" placeholder="Ex: Olá, como você está?"></textarea><div class="btns"><button class="b" id="mic">🎤 Falar</button><button class="b" id="ovO">🔊 Ouvir</button><button class="b" id="clr">Limpar</button></div><div style="font-size:10px;color:#666;margin-top:6px"><span id="cnt">0</span> caracteres • Ctrl+Enter traduz</div></div>
<div class="box"><div style="font-size:11px;color:#888">TRADUÇÃO</div><textarea id="dest" placeholder="Tradução aparece aqui..." readonly></textarea><div class="btns"><button class="b" id="ovD">🔊 Ouvir tradução</button><button class="b" id="cpy">📋 Copiar</button><button class="b" id="leg">📺 Legenda</button></div></div>
</div>
<button class="primary" id="tr">✨ TRADUZIR AGORA</button>
<div class="st" id="st">Pronto para traduzir</div>
</div>
<div class="overlay" id="over"><button class="cl" id="cLeg">✕ Fechar</button><button class="cl cl2" id="pLeg">▶ Play</button><div class="lo" id="lo"></div><div class="lt" id="lt"></div></div>
<script>
const langs=[["pt","🇧🇷 Português"],["en","🇺🇸 Inglês"],["es","🇪🇸 Espanhol"],["fr","🇫🇷 Francês"],["it","🇮🇹 Italiano"],["de","🇩🇪 Alemão"],["zh","🇨🇳 Chinês"],["ja","🇯🇵 Japonês"],["ko","🇰🇷 Coreano"],["ru","🇷🇺 Russo"],["ar","🇸🇦 Árabe"],["hi","🇮🇳 Hindi"],["nl","🇳🇱 Holandês"],["pl","🇵🇱 Polonês"],["tr","🇹🇷 Turco"],["uk","🇺🇦 Ucraniano"],["el","🇬🇷 Grego"],["he","🇮🇱 Hebraico"],["th","🇹🇭 Tailandês"],["vi","🇻🇳 Vietnamita"],["sv","🇸🇪 Sueco"],["no","🇳🇴 Norueguês"],["da","🇩🇰 Dinamarquês"],["fi","🇫🇮 Finlandês"],["ro","🇷🇴 Romeno"],["cs","🇨🇿 Tcheco"],["hu","🇭🇺 Húngaro"],["id","🇮🇩 Indonésio"],["tl","🇵🇭 Filipino"],["bn","🇧🇩 Bengali"]];
const f=document.getElementById('from'), t=document.getElementById('to');
langs.forEach(a=>{f.innerHTML+=`<option value="${a[0]}">${a[1]}</option>`; t.innerHTML+=`<option value="${a[0]}">${a[1]}</option>`});
f.value='pt'; t.value='en';
const orig=document.getElementById('orig'), dest=document.getElementById('dest'), st=document.getElementById('st'), cnt=document.getElementById('cnt');
orig.oninput=()=>cnt.textContent=orig.value.length;
async function doTr(){const txt=orig.value.trim(); if(!txt){st.textContent='Digite algo';return;} const fv=f.value, tv=t.value; if(fv==tv){dest.value=txt; st.textContent='Mesmo idioma'; return;} st.textContent='Traduzindo...'; try{const u=`https://api.mymemory.translated.net/get?q=${encodeURIComponent(txt)}&langpair=${fv}|${tv}`; const r=await fetch(u); const j=await r.json(); if(j.responseData && j.responseData.translatedText){dest.value=j.responseData.translatedText; st.textContent='✓ Traduzido';} else {dest.value=txt; st.textContent='Erro';}}catch(e){dest.value=txt+' [offline]'; st.textContent='Sem internet - modo ilustrativo';}}
document.getElementById('tr').onclick=doTr;
document.getElementById('sw').onclick=()=>{const a=f.value; f.value=t.value; t.value=a; const x=orig.value; orig.value=dest.value; dest.value=x; cnt.textContent=orig.value.length;};
document.getElementById('clr').onclick=()=>{orig.value=''; dest.value=''; cnt.textContent='0'; st.textContent='Pronto';};
function speak(txt,lg){if(!txt)return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(txt); const m={pt:'pt-BR',en:'en-US',es:'es-ES',fr:'fr-FR',it:'it-IT',de:'de-DE',zh:'zh-CN',ja:'ja-JP',ko:'ko-KR',ru:'ru-RU',ar:'ar-SA',hi:'hi-IN'}; u.lang=m[lg]||lg; u.rate=1; speechSynthesis.speak(u);}
document.getElementById('ovO').onclick=()=>speak(orig.value,f.value);
document.getElementById('ovD').onclick=()=>speak(dest.value,t.value);
document.getElementById('cpy').onclick=()=>{navigator.clipboard.writeText(dest.value); st.textContent='Copiado!';};
let rec=null;
document.getElementById('mic').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR){alert('Seu navegador não suporta microfone. Use Chrome no celular.');return;} if(rec){rec.stop();return;} rec=new SR(); rec.lang=f.value=='pt'?'pt-BR':f.value=='en'?'en-US':f.value=='es'?'es-ES':'pt-BR'; const b=document.getElementById('mic'); b.textContent='🔴 Ouvindo...'; st.textContent='Fale agora...'; rec.onresult=e=>{orig.value=e.results[0][0].transcript; cnt.textContent=orig.value.length; doTr();}; rec.onend=()=>{b.textContent='🎤 Falar'; rec=null; st.textContent='Pronto';}; rec.onerror=()=>{b.textContent='🎤 Falar'; rec=null;}; rec.start();};
const over=document.getElementById('over');
document.getElementById('leg').onclick=()=>{if(!dest.value){alert('Traduza primeiro');return;} document.getElementById('lo').textContent=orig.value; document.getElementById('lt').textContent=dest.value; over.classList.add('show');};
document.getElementById('cLeg').onclick=()=>over.classList.remove('show');
document.getElementById('pLeg').onclick=()=>speak(dest.value,t.value);
orig.addEventListener('keydown',e=>{if(e.ctrlKey && e.key==='Enter') doTr();});
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
